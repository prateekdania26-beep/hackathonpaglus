[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-detective"
version = "1.0.0"
description = "Streaming mixed-format log analysis with error grouping and crash context"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Log Detective Hackathon Team" }]
dependencies = []

[project.scripts]
log-detective = "log_detective.cli:main"
logdet = "log_detective.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["log_detective*"]
